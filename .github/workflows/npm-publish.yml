# Runs the tests on every push to master, then publishes the package to npm if
# package.json has a version that isn't on npm yet.
#
# Publishing uses npm trusted publishing: GitHub Actions proves to npm which repository
# and workflow is publishing, so no npm token is stored in this repository. It needs a
# trusted publisher set up on npmjs.com for this repository and this workflow file
# (npm-publish.yml). See https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write # lets the job prove its identity to npm

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test

      # skip publishing, instead of failing, when this version is already on npm
      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping publish. Bump the version to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
